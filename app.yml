command: ["uvicorn", "innovation_factory.backend.app:app", "--workers", "2"]

resources:
  - name: lakebase-db
    postgres:
      branch: projects/innovation-factory/branches/production
      database: projects/innovation-factory/branches/production/databases/db-pe0w-sbkpizjrbd
      permission: CAN_CONNECT_AND_CREATE
  - name: sql-warehouse
    sql_warehouse:
      id: 8af6100313039ba2
      permission: CAN_USE
  - name: issue-resolution-ka
    serving_endpoint:
      name: ka-9b426cbe-endpoint
      permission: CAN_QUERY
  - name: customer-relations-ka
    serving_endpoint:
      name: ka-1e46e5cf-endpoint
      permission: CAN_QUERY
  - name: adtech-mas
    serving_endpoint:
      name: mas-6d1add8f-endpoint
      permission: CAN_QUERY

env:
