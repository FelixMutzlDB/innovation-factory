command: ["uvicorn", "innovation_factory.backend.app:app", "--workers", "2"]

resources:
  - name: lakebase-db
    postgres:
      branch: projects/innovation-factory/branches/production
      database: projects/innovation-factory/branches/production/databases/db-e9w7-uyd0a1xns2
      permission: CAN_CONNECT_AND_CREATE
  - name: sql-warehouse
    sql_warehouse:
      id: f7cdb11888c4799e
      permission: CAN_USE
  - name: serving-endpoint
    serving_endpoint:
      name: databricks-claude-sonnet-4
      permission: CAN_QUERY
  - name: adtech-mas-endpoint
    serving_endpoint:
      name: mas-9e45f45a-endpoint
      permission: CAN_QUERY
  - name: hb-mas-endpoint
    serving_endpoint:
      name: mas-d14be5f2-endpoint
      permission: CAN_QUERY
  - name: adtech-issue-resolution-ka
    serving_endpoint:
      name: ka-005ebf14-endpoint
      permission: CAN_QUERY
  - name: adtech-customer-relations-ka
    serving_endpoint:
      name: ka-d29e8002-endpoint
      permission: CAN_QUERY

  # YARD_PRO resources. Endpoint names below are placeholders the operator
  # replaces with the real values after running scripts/yard_pro/deploy_ka.py
  # (KA) and deploy_vision.py (Vision). See scripts/yard_pro/RUNBOOK.md.
  # If the endpoints do not exist yet, leave the corresponding env vars
  # empty (lessons §18 — the UI renders a 'not configured' card, never 500s).
  - name: yard-pro-coach-ka
    serving_endpoint:
      name: ka-7598e04d-endpoint
      permission: CAN_QUERY
  - name: yard-pro-vision
    serving_endpoint:
      name: yard-pro-vision-v1
      permission: CAN_QUERY

env:
  - name: PGHOST
    value: ep-raspy-thunder-d7egfk1h.database.eu-central-1.cloud.databricks.com
  - name: PGDATABASE
    value: databricks_postgres
  - name: PGPORT
    value: 5432
  - name: PGSSLMODE
    value: require
  - name: ENDPOINT_NAME
    value: projects/innovation-factory/branches/production/endpoints/primary
  - name: UC_CATALOG
    value: felix_demo_catalog
  - name: WAREHOUSE_ID
    value: f7cdb11888c4799e

  # AECO_AUTOGEN_BEGIN: resource-ids
