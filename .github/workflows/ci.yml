name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Manual trigger for opt-in integration runs (require a live Databricks
  # workspace; we don't want these on every PR).
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run @pytest.mark.integration tests (needs DATABRICKS_HOST + DATABRICKS_TOKEN secrets)"
        required: false
        type: boolean
        default: false

# Cancel in-flight runs for the same PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Fast lint + type check. Runs first so a failing ty/tsc short-circuits the
  # build + test matrix.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ty + tsc)
    runs-on: ubuntu-latest
    # apx dev check runs bun install (frontend node_modules) before tsc.
    # Cold runs without a bun cache take 5-7 min just for the install,
    # so the previous 10-minute budget timed out the job. The install +
    # cache step below makes warm runs fast; the bumped timeout keeps
    # cold runs (and the first PR commit on a new branch) green.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # bun.lock references npm-proxy.dev.databricks.com, the internal
      # Databricks registry. That proxy isn't reachable from public
      # GitHub-hosted runners — every CI run before this one timed out
      # while bun install retried against an unreachable host. Rewrite
      # the proxy URLs to public npm just for CI; developers keep using
      # the proxy locally because their workstations have access to it.
      - name: Rewrite internal npm proxy → public npm in lockfile
        run: sed -i 's|https://npm-proxy.dev.databricks.com/|https://registry.npmjs.org/|g' bun.lock

      - name: Install frontend deps (apx-bundled bun)
        run: uv run apx bun install

      - name: Run ty + tsc via apx
        run: uv run apx dev check

  # ---------------------------------------------------------------------------
  # Unit / integration-skipped tests across a Python version matrix. Base
  # install does NOT include the image-recognition extra (torch + open-clip),
  # so non-HB tests run fast. A single HB job pulls the extra to confirm
  # recognition paths import cleanly.
  # ---------------------------------------------------------------------------
  tests:
    name: Pytest (${{ matrix.python }}, ${{ matrix.extras }})
    needs: lint
    runs-on: ubuntu-latest
    # xdist brings the suite to ~11-13 min on a 2-core runner; 20 gives
    # headroom as the suite grows (the deeper cost is per-`client` full-DB
    # re-seeding). Bump this before revisiting seeding if it creeps up again.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            extras: "base"
            sync_args: "--group dev"
          - python: "3.12"
            extras: "base"
            sync_args: "--group dev"
          - python: "3.11"
            extras: "image-recognition"
            sync_args: "--group dev --extra image-recognition"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps (${{ matrix.extras }})
        run: uv sync ${{ matrix.sync_args }}

      # innovation_factory/_metadata.py + _version.py are generated by
      # `apx build` / `apx dev check` (both gitignored). The frontend
      # __dist__ folder is generated by `apx frontend build`. The
      # tests job doesn't run apx, so stub everything with the
      # known-static values — keeps the tests job lean (no bun install,
      # no frontend build). The empty index.html satisfies Starlette's
      # StaticFiles directory check at app.py:43.
      - name: Stub apx-generated artifacts for tests
        run: |
          cat > src/innovation_factory/_metadata.py <<'EOF'
          from pathlib import Path

          app_name = "innovation-factory"
          app_entrypoint = "innovation_factory.backend.app:app"
          app_slug = "innovation_factory"
          api_prefix = "/api"
          dist_dir = Path(__file__).parent / "__dist__"
          EOF
          echo 'version = "0.0.0+ci"' > src/innovation_factory/_version.py
          mkdir -p src/innovation_factory/__dist__
          echo '<!doctype html><html><body>ci-stub</body></html>' > src/innovation_factory/__dist__/index.html

      - name: Run unit tests (skip integration)
        # Stub Databricks env vars so the AdTech `databricks-resources`
        # contract test passes — it asserts the API surface returns
        # populated values when configured. Real values are only
        # available in the integration job.
        env:
          DATABRICKS_HOST: https://stub.cloud.databricks.com
          ADTECH_DASHBOARD_ID: stub-dashboard-id
          ADTECH_GENIE_SPACE_ID: stub-genie-id
        # -n auto --dist loadscope: run in parallel across all runner cores,
        # grouping tests by module so per-module fixtures stay on one worker.
        # The serial suite (~1350 tests, dominated by per-`client` DB seeding)
        # exceeded the 15-min budget; parallel brings it well under.
        # `not visual` mirrors the pyproject addopts default (a CLI `-m`
        # overrides addopts, so it must be restated to keep visual tests out
        # of this job — they run in the dedicated `visual` job).
        run: uv run pytest -m "not integration and not visual" -n auto --dist loadscope --tb=short -q

  # ---------------------------------------------------------------------------
  # Visual regression — Playwright suite from `tests/visual/`. Needs a real
  # built frontend + a running dev server, so it's heavier than `tests`.
  # `needs: [lint, tests]` short-circuits if cheaper jobs fail. PR-only by
  # default (skipped on bare pushes to master because the visual baselines
  # in tree are the master state — running on master would be tautological).
  # ---------------------------------------------------------------------------
  visual:
    name: Visual regression (Playwright)
    needs: [lint, tests]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Freeze vi-home-one's reference clock so its seeded energy curves and the
    # trailing-window read queries anchor to the same fixed instant — the
    # households page (visual-snapshotted) is otherwise non-deterministic
    # (now-relative data). The committed baseline was captured at this instant.
    env:
      VH_REFERENCE_NOW: "2026-05-12T12:00:00+00:00"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Rewrite internal npm proxy → public npm in lockfile
        run: sed -i 's|https://npm-proxy.dev.databricks.com/|https://registry.npmjs.org/|g' bun.lock

      - name: Install frontend deps (apx-bundled bun)
        run: uv run apx bun install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: uv run apx bun playwright install --with-deps chromium

      - name: Build frontend (generates _metadata + __dist__)
        run: uv run apx build

      - name: Start dev server (daemonized by apx)
        run: uv run apx dev start

      - name: Wait for dev server and capture port
        # apx allocates the first free port from 9001 down to 9000 (and below
        # if more are taken). Probe both common ports and export the winner
        # so playwright.config.ts (which reads PW_PORT) targets the right one.
        run: |
          for i in {1..60}; do
            for port in 9001 9000; do
              if curl -sf -o /dev/null "http://localhost:$port/projects/vi-home-one"; then
                echo "Dev server ready on :$port"
                echo "PW_PORT=$port" >> "$GITHUB_ENV"
                exit 0
              fi
            done
            sleep 2
          done
          echo "Dev server did not become ready within 120s"
          uv run apx dev status || true
          exit 1

      - name: Run visual suite
        run: uv run apx bun run test:visual

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build artifacts. Runs after lint + tests so build failures don't mask
  # earlier issues.
  # ---------------------------------------------------------------------------
  build:
    name: Build (frontend + wheel)
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Rewrite internal npm proxy → public npm in lockfile
        run: sed -i 's|https://npm-proxy.dev.databricks.com/|https://registry.npmjs.org/|g' bun.lock

      - name: Build
        run: uv run apx build

      - name: Verify build outputs
        run: |
          test -f .build/app.yml || (echo ".build/app.yml missing" && exit 1)
          test -f .build/requirements.txt || (echo ".build/requirements.txt missing" && exit 1)
          ls .build/*.whl >/dev/null 2>&1 || (echo "wheel missing" && exit 1)
          echo "Build artifacts OK"

  # ---------------------------------------------------------------------------
  # Integration tests against a real Databricks workspace. Opt-in via
  # workflow_dispatch; NEVER runs on PRs (we don't want secrets leaking into
  # fork runs and we don't want every PR costing warehouse time).
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (@pytest.mark.integration)
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: integration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --group dev --extra image-recognition

      - name: Run integration tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: uv run pytest -m integration --tb=short
