bundle:
  name: "innovation-factory"

sync:
  include:
    - .build
  exclude:
    - node_modules
    - .venv
    - .git
    - "*.pyc"
    - __pycache__

artifacts:
  default:
    build: uv run apx build

resources:
  apps:
    innovation-factory-app:
      name: "innovation-factory"
      description: "rapid prototyping on an unified data & ai vision along an enterprise value chain"
      source_code_path: ./.build
      resources:
        - name: lakebase-db
          postgres:
            branch: projects/innovation-factory/branches/production
            database: projects/innovation-factory/branches/production/databases/db-e9w7-uyd0a1xns2
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: f7cdb11888c4799e
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-4
            permission: CAN_QUERY
      config:
        command: ["uvicorn", "innovation-factory.backend.app:app", "--workers", "2"]
        env:
          - name: PGHOST
            value: ep-raspy-thunder-d7egfk1h.database.eu-central-1.cloud.databricks.com
          - name: PGDATABASE
            value: databricks_postgres
          - name: PGPORT
            value: "5432"
          - name: PGSSLMODE
            value: require
          - name: ENDPOINT_NAME
            value: projects/innovation-factory/branches/production/endpoints/primary
          - name: UC_CATALOG
            value: felix_demo_catalog
          - name: WAREHOUSE_ID
            value: f7cdb11888c4799e

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: fevm-felix-demo
