bundle:
  name: "innovation-factory"

sync:
  include:
    - .build
  exclude:
    - node_modules
    - .venv
    - .git
    - "*.pyc"
    - __pycache__

artifacts:
  default:
    build: uv run apx build

resources:
  apps:
    innovation-factory-app:
      name: "innovation-factory"
      description: "rapid prototyping on an unified data & ai vision along an enterprise value chain"
      source_code_path: ./.build
      resources:
        - name: lakebase-db
          postgres:
            branch: projects/innovation-factory/branches/production
            database: projects/innovation-factory/branches/production/databases/db-pe0w-sbkpizjrbd
            permission: CAN_CONNECT_AND_CREATE
        - name: sql-warehouse
          sql_warehouse:
            id: 8af6100313039ba2
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-4
            permission: CAN_QUERY
      config:
        command: ["uvicorn", "innovation-factory.backend.app:app", "--workers", "2"]
        env:
          - name: PGHOST
            value: ep-plain-block-d1diw9v5.database.us-west-2.cloud.databricks.com
          - name: PGDATABASE
            value: databricks_postgres
          - name: PGUSER
            value: 5da5166f-5929-494a-9d57-ba7bb51a85e3
          - name: PGPORT
            value: "5432"
          - name: PGSSLMODE
            value: require
          - name: ENDPOINT_NAME
            value: projects/innovation-factory/branches/production/endpoints/primary
          - name: UC_CATALOG
            value: innovation_factory_catalog
          - name: WAREHOUSE_ID
            value: 8af6100313039ba2

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: fe-sandbox-felix-demo-sandbox
